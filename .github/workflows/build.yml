name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'packaging/**'
  pull_request:
    branches: [main]

jobs:
  # Linux: every distribution is built with its own system Qt6, so a
  # green CI here means the code really works against the Qt version
  # actual users have on disk. ubuntu-26.04 is the 2026 LTS — if the
  # GitHub image isn't published yet the matrix entry simply fails in
  # isolation (fail-fast: false).
  linux:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'ubuntu:24.04'
          - 'ubuntu:26.04'
          - 'debian:12'
          - 'debian:13'

    steps:
      - name: Install distro deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              git ca-certificates cmake build-essential libssl-dev libcups2-dev \
              qt6-base-dev qt6-base-dev-tools \
              libqt6core5compat6-dev qt6-tools-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: |
          cmake -S tests -B tests/build -DCMAKE_BUILD_TYPE=Release
          cmake --build tests/build --parallel
          ctest --test-dir tests/build --output-on-failure


  # Windows / macOS don't ship a system Qt6, so for these two we keep
  # using jurplel/install-qt-action with a pinned Qt version. This is
  # what a developer would install from qt.io anyway.
  # Windows is built both with and without OpenSSL: the "off" variant
  # is what we'd ship if we wanted a smaller, dependency-free build
  # (file encryption falls back to legacy Blowfish), the "on" variant
  # is the full feature set used for releases.
  desktop:
    name: ${{ matrix.os }} (Qt ${{ matrix.qt }}, OpenSSL=${{ matrix.openssl }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, qt: '6.7.3', openssl: 'on' }
          - { os: windows-latest, qt: '6.7.3', openssl: 'off' }
          - { os: macos-latest,   qt: '6.7.3', openssl: 'on' }

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: 'qt5compat'
          cache: true

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS' && matrix.openssl == 'on'
        run: brew install openssl@3

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows' && matrix.openssl == 'on'
        run: choco install -y openssl

      - name: Configure (CMake)
        shell: bash
        run: |
          if [ "${{ matrix.openssl }}" = "on" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTUXCARDS_WITH_OPENSSL=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTUXCARDS_WITH_OPENSSL=OFF
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      # Skipped on Windows: the test binaries link Qt6 (+ libcrypto when
      # openssl=on) and would need windeployqt run against each .exe
      # for DLLs. The same code is exercised on Linux and macOS.
      - name: Unit tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S tests -B tests/build -DCMAKE_BUILD_TYPE=Release
          cmake --build tests/build --parallel
          ctest --test-dir tests/build --output-on-failure
