name: Release

on:
  push:
    tags: ['v*']

# Needed for softprops/action-gh-release to publish artefacts.
permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [tarball, deb]
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools \
                                  libqt6core5compat6-dev qt6-tools-dev \
                                  build-essential libssl-dev libcups2-dev \
                                  cmake devscripts debhelper wget file

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package — portable bundle (tarball)
        if: matrix.kind == 'tarball'
        run: |
          VER=${GITHUB_REF#refs/tags/v}
          ROOT=tuxcards-qt6-${VER}-linux-x86_64

          # Build an XDG-style layout under usr/, then have linuxdeployqt
          # pull in every Qt6 .so + platform plugin that the binary
          # actually loads. The result is a directory that runs on any
          # glibc-compatible Linux without an external Qt install —
          # what users typically mean by "static / portable bundle".
          mkdir -p $ROOT/usr/bin $ROOT/usr/share/applications \
                   $ROOT/usr/share/icons/hicolor/32x32/apps
          cp build/tuxcards $ROOT/usr/bin/
          cp packaging/desktop/tuxcards.desktop $ROOT/usr/share/applications/
          cp src/icons/lo32-app-tuxcards.png \
             $ROOT/usr/share/icons/hicolor/32x32/apps/tuxcards.png

          wget -q -O linuxdeployqt.AppImage \
               https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt.AppImage
          # AppImage on GHA needs --appimage-extract-and-run because
          # FUSE isn't available in the runner.
          ./linuxdeployqt.AppImage --appimage-extract-and-run \
             $ROOT/usr/share/applications/tuxcards.desktop \
             -bundle-non-qt-libs \
             -extra-plugins=iconengines,platforms/libqxcb.so \
             -no-translations \
             -unsupported-allow-new-glibc

          cp README.md INSTALL.md COPYING CHANGES $ROOT/

          # Convenience launcher so users can just run ./tuxcards.sh
          # without messing with LD_LIBRARY_PATH.
          cat > $ROOT/tuxcards.sh <<'LAUNCHER'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$HERE/usr/plugins"
          exec "$HERE/usr/bin/tuxcards" "$@"
          LAUNCHER
          chmod +x $ROOT/tuxcards.sh

          tar -cJf ${ROOT}.tar.xz $ROOT

      - name: Package — .deb
        if: matrix.kind == 'deb'
        run: |
          cp -r packaging/debian ./debian
          dpkg-buildpackage -us -uc -b
          mv ../tuxcards-qt6_*.deb .

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tuxcards-qt6-*-linux-x86_64.tar.xz
            tuxcards-qt6_*.deb
          fail_on_unmatched_files: false

  rpm:
    name: Linux .rpm (Fedora)
    runs-on: ubuntu-24.04
    container: fedora:40
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          dnf install -y rpmdevtools qt6-qtbase-devel qt6-qt5compat-devel \
                         qt6-qttools-devel gcc-c++ make cmake openssl-devel \
                         cups-devel git tar
      - name: Build RPM
        run: |
          VER=${GITHUB_REF#refs/tags/v}
          rpmdev-setuptree
          sed -i "s/^Version:.*/Version:        ${VER}/" packaging/rpm/tuxcards-qt6.spec
          tar czf ~/rpmbuild/SOURCES/tuxcards-qt6-${VER}.tar.gz \
                  --transform "s,^,tuxcards-qt6-${VER}/," \
                  --exclude='.git*' --exclude='build*' .
          cp packaging/rpm/tuxcards-qt6.spec ~/rpmbuild/SPECS/
          rpmbuild -ba ~/rpmbuild/SPECS/tuxcards-qt6.spec
          mkdir -p out && cp ~/rpmbuild/RPMS/x86_64/tuxcards-qt6-*.rpm out/
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.rpm
          fail_on_unmatched_files: false

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qt5compat'
          cache: true
      - name: Install OpenSSL
        run: choco install -y openssl
      - name: Configure
        shell: cmd
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel
      - name: windeployqt + zip
        shell: cmd
        run: |
          set VER=%GITHUB_REF:refs/tags/v=%
          mkdir dist\tuxcards-qt6-%VER%-windows-x64
          copy build\Release\tuxcards.exe dist\tuxcards-qt6-%VER%-windows-x64\
          windeployqt dist\tuxcards-qt6-%VER%-windows-x64\tuxcards.exe
          powershell -Command "Compress-Archive -Path dist\tuxcards-qt6-%VER%-windows-x64 -DestinationPath tuxcards-qt6-%VER%-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: tuxcards-qt6-*-windows-x64.zip
          fail_on_unmatched_files: false

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qt5compat'
          cache: true
      - name: Install OpenSSL
        run: brew install openssl@3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: macdeployqt + DMG
        run: |
          VER=${GITHUB_REF#refs/tags/v}
          # Multi-config generators (Xcode) put the bundle in
          # build/Release/, single-config (Unix Makefiles, Ninja) puts
          # it in build/. Find whichever is there.
          APP=$(find build -maxdepth 3 -name 'tuxcards.app' -print -quit)
          test -d "$APP" || { echo "No tuxcards.app under build/"; find build -maxdepth 4 -name 'tuxcards*' ; exit 1; }
          macdeployqt "$APP" -dmg
          mv "${APP%.app}.dmg" tuxcards-qt6-${VER}-macos.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: tuxcards-qt6-*-macos.dmg
          fail_on_unmatched_files: false
