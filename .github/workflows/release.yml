name: Release

on:
  push:
    tags: ['v*']

# Needed for softprops/action-gh-release to publish artefacts.
permissions:
  contents: write

jobs:
  # Portable bundle: built once on Ubuntu 24.04 with system Qt, with
  # ldd-traced .so deps copied next to the binary. Runs anywhere with
  # a modern enough glibc.
  tarball:
    name: Linux portable tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools \
                                  libqt6core5compat6-dev qt6-tools-dev \
                                  build-essential libssl-dev libcups2-dev \
                                  cmake file

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package — portable bundle (tarball)
        run: |
          VER=${GITHUB_REF#refs/tags/v}
          ROOT=tuxcards-qt6-${VER}-linux-x86_64

          # Bundle every non-system .so the binary needs, plus Qt
          # platform / image / icon plugins. linuxdeployqt was flaky
          # against the system Qt 6.4 on Ubuntu 24.04 (silent exit 1),
          # so we do it ourselves with ldd + cp — simpler, predictable,
          # one less wget dependency.
          mkdir -p $ROOT/usr/bin $ROOT/usr/lib \
                   $ROOT/usr/plugins/platforms \
                   $ROOT/usr/plugins/imageformats \
                   $ROOT/usr/plugins/iconengines \
                   $ROOT/usr/share/applications \
                   $ROOT/usr/share/icons/hicolor/32x32/apps
          cp build/tuxcards $ROOT/usr/bin/
          cp packaging/desktop/tuxcards.desktop $ROOT/usr/share/applications/
          cp src/icons/lo32-app-tuxcards.png \
             $ROOT/usr/share/icons/hicolor/32x32/apps/tuxcards.png

          # Filter out very-low-level libs (libc, libpthread, ld-linux,
          # libGL, libX*) — those must come from the user's distro.
          SKIP='libc\.|libm\.|libdl\.|libpthread\.|libresolv\.|libnsl\.|librt\.|ld-linux|libGL\.|libGLX\.|libGLdispatch\.|libOpenGL\.|libX[0-9a-z]*\.|libxcb|libxkb|libwayland|libstdc\+\+\.|libgcc_s\.|libutil\.'
          ldd $ROOT/usr/bin/tuxcards \
            | awk '/=> \//{print $3}' \
            | grep -Ev "$SKIP" \
            | sort -u \
            | xargs -I{} cp -L {} $ROOT/usr/lib/

          # Qt plugins live under the distro plugin dir.
          QPLUG=$(dpkg -L qt6-base-dev | grep -E '/qt6/plugins$' | head -1)
          QPLUG=${QPLUG:-/usr/lib/x86_64-linux-gnu/qt6/plugins}
          cp -r $QPLUG/platforms/libqxcb.so       $ROOT/usr/plugins/platforms/  || true
          cp -r $QPLUG/platforms/libqwayland-generic.so $ROOT/usr/plugins/platforms/ || true
          cp -r $QPLUG/imageformats/*.so          $ROOT/usr/plugins/imageformats/ || true
          cp -r $QPLUG/iconengines/*.so           $ROOT/usr/plugins/iconengines/  || true

          # Pull in plugin-only .so deps that the main binary doesn't link
          # directly (xcb-cursor, EGL, ICU bits, etc.).
          for so in $(find $ROOT/usr/plugins -name '*.so'); do
            ldd "$so" 2>/dev/null \
              | awk '/=> \//{print $3}' \
              | grep -Ev "$SKIP" \
              | sort -u \
              | xargs -I{} cp -nL {} $ROOT/usr/lib/ || true
          done

          cp README.md INSTALL.md COPYING CHANGES $ROOT/

          # Convenience launcher so users can just run ./tuxcards.sh
          # without messing with LD_LIBRARY_PATH.
          cat > $ROOT/tuxcards.sh <<'LAUNCHER'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$HERE/usr/plugins"
          exec "$HERE/usr/bin/tuxcards" "$@"
          LAUNCHER
          chmod +x $ROOT/tuxcards.sh

          tar -cJf ${ROOT}.tar.xz $ROOT

      - uses: softprops/action-gh-release@v2
        with:
          files: tuxcards-qt6-*-linux-x86_64.tar.xz
          fail_on_unmatched_files: false


  # One native .deb per supported Debian/Ubuntu release. dpkg-shlibdeps
  # resolves Qt6 / OpenSSL / Cups deps against each distro's own
  # packages — so the resulting .deb installs cleanly with the right
  # `Depends:` lines for that distro, no version-skew surprises.
  deb:
    name: ${{ matrix.image }} .deb
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # codename is the short tag we paste into the .deb filename.
        include:
          - { image: 'ubuntu:24.04', codename: 'ubuntu24.04' }
          - { image: 'ubuntu:26.04', codename: 'ubuntu26.04' }
          - { image: 'debian:12',    codename: 'debian12'    }
          - { image: 'debian:13',    codename: 'debian13'    }
    steps:
      - name: Install build deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              git ca-certificates cmake build-essential libssl-dev libcups2-dev \
              qt6-base-dev qt6-base-dev-tools \
              libqt6core5compat6-dev qt6-tools-dev \
              devscripts debhelper fakeroot file

      - uses: actions/checkout@v4

      - name: Build .deb
        run: |
          VER=${GITHUB_REF#refs/tags/v}
          cp -r packaging/debian ./debian
          dpkg-buildpackage -us -uc -b
          # dpkg-buildpackage drops the .deb in the parent of the source
          # tree. Rename so each distro gets a distinct filename.
          mkdir out
          for f in ../tuxcards-qt6_*.deb; do
            base=$(basename "$f" .deb)
            mv "$f" out/${base}_${{ matrix.codename }}.deb
          done
          ls -la out/

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.deb
          fail_on_unmatched_files: false

  rpm:
    name: Linux .rpm (Fedora)
    runs-on: ubuntu-24.04
    container: fedora:40
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          dnf install -y rpmdevtools qt6-qtbase-devel qt6-qt5compat-devel \
                         qt6-qttools-devel gcc-c++ make cmake openssl-devel \
                         cups-devel git tar
      - name: Build RPM
        run: |
          VER=${GITHUB_REF#refs/tags/v}
          rpmdev-setuptree
          sed -i "s/^Version:.*/Version:        ${VER}/" packaging/rpm/tuxcards-qt6.spec
          tar czf ~/rpmbuild/SOURCES/tuxcards-qt6-${VER}.tar.gz \
                  --transform "s,^,tuxcards-qt6-${VER}/," \
                  --exclude='.git*' --exclude='build*' .
          cp packaging/rpm/tuxcards-qt6.spec ~/rpmbuild/SPECS/
          rpmbuild -ba ~/rpmbuild/SPECS/tuxcards-qt6.spec
          mkdir -p out && cp ~/rpmbuild/RPMS/x86_64/tuxcards-qt6-*.rpm out/
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.rpm
          fail_on_unmatched_files: false

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qt5compat'
          cache: true
      - name: Install OpenSSL
        run: choco install -y openssl
      - name: Configure
        shell: cmd
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel
      - name: windeployqt + zip
        shell: cmd
        run: |
          set VER=%GITHUB_REF:refs/tags/v=%
          mkdir dist\tuxcards-qt6-%VER%-windows-x64
          copy build\Release\tuxcards.exe dist\tuxcards-qt6-%VER%-windows-x64\
          windeployqt dist\tuxcards-qt6-%VER%-windows-x64\tuxcards.exe
          powershell -Command "Compress-Archive -Path dist\tuxcards-qt6-%VER%-windows-x64 -DestinationPath tuxcards-qt6-%VER%-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: tuxcards-qt6-*-windows-x64.zip
          fail_on_unmatched_files: false

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qt5compat'
          cache: true
      - name: Install OpenSSL
        run: brew install openssl@3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: macdeployqt + DMG
        run: |
          VER=${GITHUB_REF#refs/tags/v}
          # Multi-config generators (Xcode) put the bundle in
          # build/Release/, single-config (Unix Makefiles, Ninja) puts
          # it in build/. Find whichever is there.
          APP=$(find build -maxdepth 3 -name 'tuxcards.app' -print -quit)
          test -d "$APP" || { echo "No tuxcards.app under build/"; find build -maxdepth 4 -name 'tuxcards*' ; exit 1; }
          macdeployqt "$APP" -dmg
          mv "${APP%.app}.dmg" tuxcards-qt6-${VER}-macos.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: tuxcards-qt6-*-macos.dmg
          fail_on_unmatched_files: false
